name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: build binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - name: Build on macOS
        if: runner.os == 'macOS'
        run: ./scripts/build_macos.sh
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: ./scripts/build_linux.sh
      - name: Archive binary (zip on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Lannotex -DestinationPath Lannotex-Windows.zip
      - name: Archive binary (tar.gz on macOS / Linux)
        if: runner.os != 'Windows'
        run: tar -czf Lannotex-${{ runner.os }}.tar.gz -C dist Lannotex
      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: Lannotex-${{ runner.os }}
          path: |
            Lannotex-*.zip
            Lannotex-*.tar.gz
          if-no-files-found: error

  release:
    name: attach binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [$version]" '
            index($0, h) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          name: Lannotex ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/Lannotex-*.zip
            artifacts/Lannotex-*.tar.gz

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lannotex
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
