name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install package (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Run tests
        run: python -m pytest
      - name: CLI smoke check
        run: |
          lannotex --version
          python -m lannotex --version
      - name: Build sdist + wheel
        run: python -m build

  install:
    name: uv tool install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel
        run: uv build --wheel --out-dir dist
      - name: Install as a tool on the newest Python and run headless commands
        shell: bash
        run: |
          uv tool install --python 3.14 dist/*.whl
          lannotex --version
          lannotex new smoke-project
          lannotex analyze smoke-project
