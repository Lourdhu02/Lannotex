[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labelreview-desktop"
version = "0.0.1"
description = "Fast local image annotation desktop application"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3", "Pillow==11.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pyinstaller==6.11.1"]

[project.scripts]
labelreview = "labelreview.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
