[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lannotex"
version = "0.0.2"
description = "Fast, offline-first image annotation for classifications, boxes, and polygons."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Lannotex contributors" }]
keywords = ["annotation", "labeling", "computer-vision", "yolo", "coco", "labelme", "qt", "pyside6", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Ranges, not pins: exact pins break installs on newer Pythons. Release binaries pin
# their full set in requirements-windows-build.txt.
dependencies = ["PySide6-Essentials>=6.8.3,<7", "Pillow>=11.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pyinstaller>=6.11.1",
    "ruff>=0.11.2",
    "build>=1.2.2",
    "twine>=6.1",
]

[project.scripts]
lannotex = "lannotex.cli:main"
lannotex-gui = "lannotex.app:main"

[project.urls]
Homepage = "https://github.com/Lourdhu02/Lannotex"
Source = "https://github.com/Lourdhu02/Lannotex"
Issues = "https://github.com/Lourdhu02/Lannotex/issues"
Documentation = "https://lourdhu02.github.io/Lannotex/"
Changelog = "https://github.com/Lourdhu02/Lannotex/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lannotex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E9", "F"]

